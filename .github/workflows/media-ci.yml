name: Media CI

on:
  push:
    paths:
      - 'media/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'README.md'
      - 'docs/DEPLOYMENT.md'
      - 'docs/OPERATIONS.md'
      - 'docs/YOUTUBE_COOKIES.md'
      - 'tests/deploy-config.test.js'
      - 'tests/deployment-config.test.js'
      - 'tests/fixtures/media-grant-v1.json'
      - '.github/workflows/media-ci.yml'
  pull_request:
    paths:
      - 'media/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'README.md'
      - 'docs/DEPLOYMENT.md'
      - 'docs/OPERATIONS.md'
      - 'docs/YOUTUBE_COOKIES.md'
      - 'tests/deploy-config.test.js'
      - 'tests/deployment-config.test.js'
      - 'tests/fixtures/media-grant-v1.json'
      - '.github/workflows/media-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test deployment contracts
        run: node --test tests/deploy-config.test.js tests/deployment-config.test.js

      - name: Install and test
        env:
          MEDIA_GRANT_SECRET: ci-media-grant-secret-at-least-32-bytes
        run: |
          python -m pip install --editable 'media[test]'
          python -m pytest media

      - name: Build Python 3.13 image
        run: docker build --tag dreamstream-media:test media

      - name: Validate and build media egress relay
        env:
          MEDIA_GRANT_SECRET: ci-media-grant-secret-at-least-32-bytes
          SSH_EGRESS_IPV6: 2001:db8::1
        run: |
          docker compose \
            --file docker-compose.yml \
            --file deploy/compose.media-egress.yml \
            config --quiet
          docker build \
            --tag dreamstream-media-egress-relay:test \
            --file deploy/media-egress-relay.Dockerfile .

      - name: Smoke-test image health
        run: |
          docker run --detach --name dreamstream-media-smoke \
            --env MEDIA_GRANT_SECRET=ci-media-grant-secret-at-least-32-bytes \
            --publish 127.0.0.1:18080:8080 dreamstream-media:test
          trap 'docker rm --force dreamstream-media-smoke' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null && exit 0
            sleep 1
          done
          docker logs dreamstream-media-smoke
          exit 1
