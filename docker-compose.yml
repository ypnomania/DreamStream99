name: dreamstream99

services:
  control:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    logging: &bounded-logs
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://ypnomania.github.io}
      MEDIA_GRANT_SECRET: ${MEDIA_GRANT_SECRET:?set MEDIA_GRANT_SECRET in .env}
      MAX_ROOMS: ${MAX_ROOMS:-10000}
    ports:
      # Host Caddy may reach this loopback port; never publish control directly.
      - "127.0.0.1:${CONTROL_PORT:-8787}:8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  media:
    build:
      context: media
      args:
        YTDLP_PLUGIN_PACKAGE: ${YTDLP_PLUGIN_PACKAGE:-bgutil-ytdlp-pot-provider==1.3.1}
    restart: unless-stopped
    init: true
    logging: *bounded-logs
    environment:
      HOME: /tmp
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://ypnomania.github.io}
      MEDIA_GRANT_SECRET: ${MEDIA_GRANT_SECRET:?set MEDIA_GRANT_SECRET in .env}
      # A read-only secret is staged into a private tmpfs working file at startup.
      YTDLP_COOKIEFILE_SOURCE: ${YTDLP_COOKIEFILE_SOURCE:-}
      YTDLP_COOKIEFILE: ${YTDLP_COOKIEFILE:-}
      YTDLP_PLAYER_CLIENT: ${YTDLP_PLAYER_CLIENT:-default}
      YTDLP_PO_TOKEN_PROVIDER: ${YTDLP_PO_TOKEN_PROVIDER:-youtubepot-bgutilhttp:base_url=http://pot-provider:4416}
      MEDIA_EGRESS_PROXY: ${MEDIA_EGRESS_PROXY:-}
      # Deprecated compatibility alias. Leave empty when MEDIA_EGRESS_PROXY is used.
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_SOCKET_TIMEOUT: ${YTDLP_SOCKET_TIMEOUT:-20}
      RELAY_REFRESH_TIMEOUT_SECONDS: ${RELAY_REFRESH_TIMEOUT_SECONDS:-30}
      RELAY_REFRESH_FAILURE_COOLDOWN_SECONDS: ${RELAY_REFRESH_FAILURE_COOLDOWN_SECONDS:-5}
      RELAY_MAX_CONCURRENT_REFRESHES: ${RELAY_MAX_CONCURRENT_REFRESHES:-4}
    ports:
      # Host Caddy may reach this loopback port; never publish media directly.
      - "127.0.0.1:${MEDIA_PORT:-8788}:8080"
    volumes:
      # Mount only media-owned secrets; egress node credentials live in a
      # separate host directory that this container cannot read.
      - ./deploy/secrets/media:/run/secrets:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      pot-provider:
        condition: service_healthy

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    init: true
    # The upstream helper prints generated PO tokens; do not persist them in
    # the production Docker log store.
    logging:
      driver: "none"
    expose:
      - "4416"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  gateway:
    image: caddy:2.11.4-alpine
    profiles:
      - bundled-gateway
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-dreamstream.lucius7.dev}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://ypnomania.github.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      control:
        condition: service_healthy
      media:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
